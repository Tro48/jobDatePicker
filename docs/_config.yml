# GitHub Pages для одной страницы — политики конфиденциальности.
#
# Адрес страницы указан в карточке RuStore и в самом приложении, поэтому он
# зафиксирован permalink'ом в самом файле, а не собирается из имени: переименуют
# файл — ссылка не переедет.
#
# Сайт живёт в каталоге docs/ ветки main. Тема не подключается: страница
# верстается своим макетом, чтобы её вид не зависел от обновлений чужой темы.
title: Смены
description: Календарь сменного графика для Android
lang: ru
baseurl: /jobDatePicker
url: https://tro48.github.io

# В репозиторий из docs/ попадает только политика: остальное — рабочие
# заметки, они отсечены в .gitignore. На всякий случай то же сказано и сборке.
exclude:
  - '*.md'
include:
  - privacy.md
  - index.md
