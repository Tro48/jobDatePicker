buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // Плагин компилятора Compose нужен Glance: виджет — это Compose, только
    // рисуемый процессом лаунчера. Подключается ровно так же, как это делает
    // сам expo-modules-core, — версия берётся от Kotlin, который уже собирает
    // проект, иначе компилятор и плагин разъедутся.
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.trofimdev.jobdatepicker.widget'
version = '0.1.0'

android {
  namespace "com.trofimdev.jobdatepicker.widget"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.glance:glance-appwidget:1.1.1"
}
