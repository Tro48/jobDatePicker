# Проверки, которые не требуют ни Android SDK, ни телефона.
#
# Два набора тестов не случайно: доменный бежит в голом Node и этим доказывает,
# что расчёты не завязаны ни на React, ни на сборщик; jest поднимает настоящий
# React Native и проверяет экраны, хуки и хранилище.
#
# Файл вызывается двумя способами: сам по себе на ветке dev и в пул-реквестах,
# и через workflow_call из build.yml перед сборкой. Так шаги описаны один раз,
# а не скопированы в два места.
name: Проверки

on:
  workflow_call:
  pull_request:
  push:
    branches: [dev]

# Своей группы concurrency здесь нет намеренно. Внутри workflow_call
# github.workflow — это имя вызывающего workflow, поэтому две сборки разных
# профилей попадали в одну группу и гасили друг друга. Ограничения задаются в
# вызывающих workflow, а лишние параллельные прогоны на публичном репозитории
# бесплатны.

jobs:
  checks:
    name: Линтер, типы, тесты, контраст
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        # Только проверка, без правки: CI не должен молча переписывать код.
        run: npm run format:check

      - name: Типы
        # Осознанное ограничение: типы маршрутов expo-router генерирует только
        # dev-сервер, а .expo/ не в репозитории. Значит, здесь tsc не проверит
        # пути в router.push — они проверяются локально после npm start.
        # Цена ошибки низкая: несуществующий путь даёт экран "Unmatched route",
        # а не падение.
        run: npm run typecheck

      - name: Тесты доменного слоя
        run: npm run test:domain

      - name: Тесты экранов и хранилища
        run: npm run test:ui

      - name: Контраст палитры по WCAG
        run: npm run check:contrast

      - name: Конфигурация проекта Expo
        run: npx expo-doctor

      - name: Сборка JS-бандла под Android
        # Ловит то, что не видит tsc: несуществующие модули, ошибки резолва
        # алиасов и путей маршрутов.
        run: npx expo export --platform android --output-dir /tmp/export-check
