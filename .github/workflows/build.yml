# Сборка APK в облаке EAS. Запускается руками.
#
# На мерж в main повешено обновление по воздуху (update.yml): оно закрывает
# правки экранов и расчётов. Сюда приходят только изменения нативной части —
# нативный модуль, новые нативные зависимости, разрешения, иконка, заставка,
# всё, что попадает в манифест Android. Такое по воздуху не доставить, а
# собирать APK на каждый мерж нельзя: у бесплатного аккаунта 15 сборок в месяц.
#
# Сборка идёт только после зелёных проверок: APK из кода, который не проходит
# типы или тесты, стоил бы столько же, сколько рабочий.
name: Сборка Android

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: EAS Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Постановка сборки в очередь
        # --no-wait: workflow не ждёт окончания сборки и не жжёт минуты
        # GitHub Actions. Ссылка на APK придёт на expo.dev.
        run: eas build --platform android --profile production --non-interactive --no-wait
