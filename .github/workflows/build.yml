# Сборка APK в облаке EAS.
#
# Сюда приходят изменения нативной части — нативный модуль, новые нативные
# зависимости, разрешения, иконка, заставка, всё, что попадает в манифест
# Android. По воздуху такое не доставить. Правки экранов и расчётов закрывает
# обновление (update.yml), и собирать ради них APK нельзя: у бесплатного
# аккаунта 15 сборок в месяц.
#
# Запускается двумя способами: руками с выбором профиля и вызовом из update.yml,
# когда мерж в main изменил отпечаток нативной части. Решает там сверка
# отпечатков, здесь профиль просто приходит входным параметром.
#
# Сборка идёт только после зелёных проверок: APK из кода, который не проходит
# типы или тесты, стоил бы столько же, сколько рабочий.
name: Сборка Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Профиль сборки
        type: choice
        options:
          - production
          - development
        default: production
  # Вызов из update.yml. Проверки ниже прогоняются ещё раз, хотя вызывающий их
  # уже гонял: развязывать это условием дороже, чем лишний бесплатный прогон.
  workflow_call:
    inputs:
      profile:
        description: Профиль сборки
        type: string
        default: production

concurrency:
  group: build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: EAS Build
    needs: checks
    runs-on: ubuntu-latest
    # Нужно, чтобы workflow мог создать релиз с APK и списком выпусков.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Вершина ветки, а не коммит события: при вызове из update.yml версию
          # к этому моменту уже подняла отдельная джоба, и APK должен нести
          # именно её, а не ту, что была в мерж-коммите.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Сборка APK
        # --wait, а не --no-wait: без ожидания не узнать ни ссылку на APK, ни
        # отпечаток нативной части, а без них нечего класть в список выпусков.
        # Минуты Actions на публичном репозитории бесплатны.
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --json --wait > build.json

      - name: Выпуск на GitHub
        # APK переезжает в релиз репозитория по двум причинам: артефакты EAS на
        # бесплатном аккаунте живут 30 дней, а ссылка релиза постоянная —
        # приложение читает по ней список выпусков и никогда не промахивается.
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail

          artifact=$(jq -er '.[0].artifacts.applicationArchiveUrl' build.json)
          version=$(jq -er '.[0].appVersion' build.json)
          # Отпечаток лежит в runtime.version, а не в runtimeVersion: поля с
          # таким именем в ответе EAS нет, и шаг падал без объяснений.
          runtime=$(jq -er '.[0].runtime.version' build.json) || {
            echo "В ответе EAS нет runtime.version. Что пришло:"
            jq '.[0] | keys' build.json
            exit 1
          }

          if [ "$PROFILE" = "development" ]; then
            apk="smeny-dev-$version.apk"
            tag="dev-v$version-${runtime:0:8}"
          else
            apk="smeny-$version.apk"
            tag="v$version-${runtime:0:8}"
          fi

          curl -fsSL "$artifact" -o "$apk"

          if [ "$PROFILE" = "development" ]; then
            # Отладочная сборка помечается предварительным выпуском: иначе
            # ссылка releases/latest увела бы приложение на неё вместо рабочей.
            gh release create "$tag" "$apk" \
              --prerelease \
              --title "Смены dev $version" \
              --notes "Отладочная сборка. Отпечаток нативной части: $runtime" \
              || gh release upload "$tag" "$apk" --clobber
            exit 0
          fi

          jq -n \
            --arg runtimeVersion "$runtime" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$tag/$apk" \
            --arg version "$version" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{runtimeVersion: $runtimeVersion, url: $url, version: $version, builtAt: $builtAt}' \
            > android.json

          gh release create "$tag" "$apk" android.json \
            --title "Смены $version" \
            --notes "Отпечаток нативной части: $runtime" \
            || gh release upload "$tag" "$apk" android.json --clobber
