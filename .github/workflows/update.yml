# Что уезжает на телефон при попадании изменений в main.
#
# Развилка одна и решает её отпечаток нативной части. Правки экранов и расчётов
# уходят обновлением по воздуху за секунды и квоту сборок не трогают. А вот
# нативный код Android разрешает менять только установкой подписанного APK —
# если отпечаток разошёлся с уже выпущенным, обновление никому не доедет, и
# вместо него запускается сборка.
#
# Раньше сборка стояла отдельно и запускалась руками. Это и подводило: мерж с
# нативной правкой публиковал обновление под новым отпечатком, которого нет ни
# на одном телефоне, и напомнить об этом было некому.
#
# Обновление публикуется в две ветки: production и rustore. У магазинной
# сборки свой отпечаток и свой канал — из манифеста вырезаны инструменты
# разработки, — поэтому одной веткой её не догнать.
name: Выкатка в main

on:
  push:
    branches: [main]
  # Ручной запуск: перевыложить тот же код, не делая пустой коммит.
  workflow_dispatch:

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

# Нужно джобе версии, чтобы запушить подъём, и вызываемой сборке, чтобы создать
# релиз с APK.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Рубеж перед выпуском: пуш в main обязан менять список «что нового».
  # Текст записей пишется вручную — автоматика только не пускает релиз без
  # записи. Коммит подъёма версии джобу не запускает ([skip ci]), поэтому
  # здесь видны только настоящие пуши с изменениями.
  notes:
    name: «Что нового» обновлено
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Нужны оба конца диапазона пуша: before может быть не прямым предком.
          fetch-depth: 0

      - name: Пуш менял список записей?
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # У workflow_dispatch границ пуша нет: перевыкладка того же кода
          # проверять нечего.
          if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
            echo "Границ пуша нет (workflow_dispatch) — проверять нечего."
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'src/domain/releaseNotes.ts'; then
            echo "Список записей обновлён — релиз идёт."
          else
            echo "Пуш не менял src/domain/releaseNotes.ts: добавь запись в «Что нового» и смержи снова."
            exit 1
          fi

  native:
    name: Менялась ли нативная часть
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сверка отпечатков
        id: compare
        run: |
          set -euo pipefail

          # APP_VARIANT намеренно не задан: считаем отпечаток рабочего варианта,
          # его же несёт production-сборка. Версию приложения отпечаток не
          # учитывает — так настроен fingerprint.config.js, иначе каждый подъём
          # версии выглядел бы сменой нативной части.
          current=$(npx expo-updates fingerprint:generate --platform android | jq -er '.hash')

          # Отпечаток уже выпущенного APK лежит в том же android.json, который
          # читает само приложение, — второго источника правды заводить незачем.
          # Нет выпуска или не достучались: считаем, что нативная часть менялась.
          # Лишняя сборка обходится дешевле, чем правка, молча не доехавшая до
          # телефона.
          shipped=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/android.json" | jq -er '.runtimeVersion') || shipped=""

          if [ "$current" = "$shipped" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Отпечаток тот же ($current). Хватит обновления по воздуху." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Отпечаток разошёлся: было ${shipped:-выпуска нет}, стало $current. Нужна сборка APK." >> "$GITHUB_STEP_SUMMARY"
          fi

  version:
    name: Версия
    # Ждёт проверок и рубежа «что нового»: без этого версия поднималась и
    # уезжала в main даже тогда, когда тесты красные или записи не обновлены.
    needs: [checks, notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Поднять патч-версию
        # Версия меняется на каждом попадании в main: по ней видно, что
        # приехало на телефон, и по ней же называются APK. Живёт она только на
        # main — на dev её никто не трогает, поэтому мержи не конфликтуют.
        #
        # Вместе с ней растёт versionCode: RuStore не примет вторую загрузку с
        # тем же кодом, а поднимать его руками — значит однажды забыть.
        # [skip ci] в сообщении: без него коммит запустил бы этот же workflow.
        run: |
          set -euo pipefail
          next=$(node -e "const v=require('./app.json').expo.version.split('.').map(Number); v[2]+=1; console.log(v.join('.'))")
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.version = process.argv[1];
            config.expo.android.versionCode = (config.expo.android.versionCode ?? 0) + 1;
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          " "$next"
          code=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Версия $next ($code) [skip ci]"
          git push

  # Нативная часть изменилась — по воздуху её не доставить, собираем APK.
  # Две сборки из одного кода: production для обновлений с GitHub и rustore
  # для магазина. Магазинная отличается манифестом (без инструментов
  # разработки) и каналом обновлений, поэтому production-APK ей не замена.
  build:
    name: Сборка APK
    needs: [version, native]
    if: needs.native.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      profile: production
    secrets: inherit

  # После сборки build.yml сам отправляет APK в RuStore: создаёт черновик
  # версии, заливает файл и отправляет на модерацию.
  build-rustore:
    name: Сборка для RuStore
    needs: [version, native]
    if: needs.native.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      profile: rustore
    secrets: inherit

  # Изменился только JS — обновление уезжает на телефон само.
  update:
    name: EAS Update
    needs: [version, native]
    if: needs.native.outputs.changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Обновление публикуется уже с поднятой версией.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Публикация обновления
        # Сообщение через переменную окружения, а не подстановкой в команду:
        # в тексте коммита бывают кавычки и переводы строк.
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        # Ветка обновлений называется так же, как канал в eas.json: сборка с
        # каналом production получает обновления ветки production. Для
        # магазинной сборки APP_DISTRIBUTION=rustore обязателен: он меняет
        # app.config, а вместе с ним и отпечаток нативной части, по которому
        # expo-updates решает, кому обновление положено.
        run: |
          set -euo pipefail
          eas update --platform android --branch production --message "$MESSAGE" --non-interactive
          APP_DISTRIBUTION=rustore eas update --platform android --branch rustore --message "$MESSAGE" --non-interactive
